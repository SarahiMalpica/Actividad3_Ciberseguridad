env:
  contexts:
  - name: API-local-admin
    urls:
    - http://127.0.0.1:3000
    includePaths:
    - ^http://127[.]0[.]0[.]1:3000/.*$
  parameters:
    failOnError: true
    failOnWarning: true
    continueOnFailure: false
    progressToStdout: false
jobs:
- type: replacer
  parameters:
    deleteAllRules: true
  rules:
  - description: Bearer temporal para rutas privadas de la API local
    url: ^http://127[.]0[.]0[.]1:3000/api/(perfil|admin)([?].*)?$
    matchType: req_header
    matchString: Authorization
    matchRegex: false
    replacementString: Bearer ${ACTIVIDAD3_ZAP_TOKEN}
    tokenProcessing: false
- type: requestor
  requests:
  - url: http://127.0.0.1:3000/health
    method: GET
    responseCode: 200
  - url: http://127.0.0.1:3000/api/perfil
    method: GET
    responseCode: 200
  - url: http://127.0.0.1:3000/api/admin
    method: GET
    responseCode: 200
- type: openapi
  parameters:
    apiFile: D:/Actividad3_Ciberseguridad/ZAP/api-local.openapi.json
    context: API-local-admin
    targetUrl: http://127.0.0.1:3000
- type: activeScan
  parameters:
    context: API-local-admin
    maxRuleDurationInMins: 1
    maxScanDurationInMins: 5
    addQueryParam: true
    scanHeadersAllRequests: true
    threadPerHost: 2
    delayInMs: 20
  policyDefinition:
    defaultStrength: Medium
    defaultThreshold: Medium
    rules:
    - id: 40026
      name: DOM XSS - fuera del alcance de esta API JSON
      threshold: 'Off'
- type: requestor
  requests:
  - url: http://127.0.0.1:3000/health
    method: GET
    responseCode: 200
  - url: http://127.0.0.1:3000/api/perfil
    method: GET
    responseCode: 200
  - url: http://127.0.0.1:3000/api/admin
    method: GET
    responseCode: 200
- type: passiveScan-wait
  parameters:
    maxDuration: 3
- type: report
  parameters:
    template: traditional-html
    reportDir: D:/Actividad3_Ciberseguridad/Herramientas/ZAP/Datos-API-Admin/ReportesPrivados
    reportFile: 10_ZAP_admin_api.html
    reportTitle: Actividad 3 - ZAP API JSON - rol admin
    reportDescription: API local HTTP/JSON. Rol admin. DOM XSS 40026 excluido, Client Integration desactivado. Informe
      original privado; usar copias compartibles con credenciales redactadas.
    displayReport: false
- type: report
  parameters:
    template: traditional-json
    reportDir: D:/Actividad3_Ciberseguridad/Herramientas/ZAP/Datos-API-Admin/ReportesPrivados
    reportFile: 10_ZAP_admin_api.json
    reportTitle: Actividad 3 - ZAP API JSON - rol admin
    reportDescription: API local HTTP/JSON. Rol admin. DOM XSS 40026 excluido, Client Integration desactivado. Informe
      original privado; usar copias compartibles con credenciales redactadas.
    displayReport: false
