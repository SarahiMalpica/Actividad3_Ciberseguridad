# Preparacion para una demo. Este archivo no publica nada por si solo.
services:
  - type: web
    name: actividad3-ciberseguridad
    runtime: node
    plan: free
    rootDir: API
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: ACTIVIDAD3_DEMO_PUBLICA
        value: "1"
